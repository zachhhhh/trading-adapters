name: Python Adapter Upstream Compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    name: ${{ matrix.framework }} (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: backtrader
            lane: minimum
            dependency: backtrader==1.9.78.123
          - framework: backtrader
            lane: latest
            dependency: backtrader
          - framework: backtesting
            lane: minimum
            dependency: backtesting==0.6.5
          - framework: backtesting
            lane: latest
            dependency: backtesting
          - framework: vectorbt
            lane: minimum
            dependency: vectorbt==0.28.0
          - framework: vectorbt
            lane: latest
            dependency: vectorbt

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: Install SDK and upstream framework
        run: |
          python -m pip install --disable-pip-version-check -e "packages/python-sdk[research]"
          python -m pip install --disable-pip-version-check "${{ matrix.dependency }}"

      - name: Run native framework smoke
        run: python scripts/smoke_python_adapter_upstream.py "${{ matrix.framework }}"

      - name: Generate Python dependency SBOM
        run: python scripts/generate_python_sbom.py --output "artifacts/${{ matrix.framework }}-${{ matrix.lane }}.cdx.json"

      - name: Upload compatibility SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter-sbom-${{ matrix.framework }}-${{ matrix.lane }}
          path: artifacts/*.cdx.json
          if-no-files-found: error
