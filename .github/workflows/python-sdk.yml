name: Python SDK

on:
  pull_request:
    paths:
      - "packages/python-sdk/**"
      - "examples/oss-trading-adapters/**"
      - "docs/public/OSS_TRADING_FRAMEWORKS.md"
      - "scripts/check_python_adapter_compatibility.py"
      - "scripts/smoke_python_adapter_upstream.py"
      - "package.json"
      - ".github/workflows/python-sdk.yml"
      - ".github/workflows/python-adapter-upstream.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifact to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: Install package tooling
        run: |
          python -m pip install --disable-pip-version-check build mypy twine
          python -m pip install --disable-pip-version-check -e packages/python-sdk

      - name: Run unit tests
        run: python -m unittest discover -s packages/python-sdk/tests -p 'test_*.py'

      - name: Compile framework starters
        run: python -m compileall -q examples/oss-trading-adapters

      - name: Smoke adapter CLI from source
        env:
          PYTHONPATH: packages/python-sdk/src
        run: python -m norynta.frameworks list

      - name: Verify upstream compatibility manifest
        run: python scripts/check_python_adapter_compatibility.py

      - name: Run strict type checking
        run: python -m mypy --config-file packages/python-sdk/pyproject.toml packages/python-sdk/src/norynta

      - name: Build distribution
        run: python -m build packages/python-sdk

      - name: Verify distribution metadata
        run: python -m twine check packages/python-sdk/dist/*

      - name: Smoke installed wheel and console entrypoint
        run: |
          python -m venv /tmp/norynta-adapter-wheel
          /tmp/norynta-adapter-wheel/bin/python -m pip install --disable-pip-version-check --no-deps packages/python-sdk/dist/*.whl
          /tmp/norynta-adapter-wheel/bin/norynta-adapters list

      - name: Upload verified distribution
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdk-dist
          path: packages/python-sdk/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-sdk-dist
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
