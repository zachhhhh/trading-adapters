[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openbb-norynta"
version = "0.1.0"
description = "Norynta historical prediction-market data provider for OpenBB."
requires-python = ">=3.11"
dependencies = [
  "norynta>=0.1.0",
  "openbb-core>=1.5,<2",
]

[project.entry-points."openbb_provider_extension"]
norynta = "openbb_norynta.provider:norynta_provider"

[tool.hatch.build.targets.wheel]
packages = ["openbb_norynta"]
